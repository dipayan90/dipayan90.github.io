site_name: Dipayan Chattopadhyay
site_url: https://dipayan90.github.io
repo_url: https://github.com/dipayan90/dipayan90.github.io
repo_name: About Dipayan
site_author: Dipayan Chattopadhyay
site_description: Professional portfolio of Dipayan Chattopadhyay, Software Development Manager at AWS
docs_dir: docs/

nav:
  - Home: index.md
  - About Me: summary.md
  - Experience: experience.md
  - Projects: opensource.md
  - Skills & Expertise: skills.md
  - Personal: miscellaneous.md
  - Ask: ask.md

not_in_nav: /blog/.*/
draft_docs: blog/posts/drafts/

theme:
  name: material
  custom_dir: overrides
  # Material defaults to Roboto (theme-level), so deleting the key alone still
  # loads Google Fonts. `false` is what removes the request (B6′).
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - search.highlight
    - search.share
    - content.code.copy
  logo: assets/favicon.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: blog/posts
      post_url_format: "{slug}"
      categories: false
      archive: false
      authors: false

hooks:
  - hooks/qa_build.py
  - hooks/feed.py

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/javascripts/ask.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dipayan90
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/dchattopadhyay
    - icon: fontawesome/brands/wordpress
      link: https://dipayan90.wordpress.com
    - icon: fontawesome/solid/envelope
      link: mailto:dipayan90@gmail.com

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - admonition
  - pymdownx.details

copyright: Copyright &copy; Dipayan Chattopadhyay
